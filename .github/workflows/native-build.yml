name: Native builds (Android APK + Windows EXE)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-ecosystem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Drop the legacy hand-written gradle files; Flutter generates a matching, up-to-date setup.
      - run: rm -f android/app/build.gradle android/app/proguard-rules.pro
      - run: flutter create --platforms=android --org com.scanner --project-name my_multi_functional_scanner .
      - name: Apply app logo (launcher icons)
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp branding/android/ic_launcher_$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
      - name: Android permissions (internet, camera, http on local network)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s##<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application android:usesCleartextTraffic="true"#' "$M"
          grep -n "uses-permission\|usesCleartextTraffic" "$M"
      - name: Disable R8 minify
        run: |
          [ -f android/app/build.gradle.kts ] && sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false/' android/app/build.gradle.kts || true
          [ -f android/app/build.gradle ] && sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.debug\n            minifyEnabled false\n            shrinkResources false/' android/app/build.gradle || true
          grep -n -i "minify" android/app/build.gradle* || echo "WARNING: minify line not inserted"
      - name: Disable lint on release builds
        run: |
          [ -f android/app/build.gradle.kts ] && sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' android/app/build.gradle.kts || true
          [ -f android/app/build.gradle ] && sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }/' android/app/build.gradle || true
          grep -n -A3 "lint {" android/app/build.gradle* || echo "WARNING: lint block not inserted"
      - name: Set minSdk 24
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i 's/flutter\.minSdkVersion/24/' "$f" || true
          done
      - run: flutter pub get
      - name: Patch plugins for the newer Android Gradle Plugin
        run: |
          # Old plugins still ask for proguard-android.txt, which the new Android build tools reject.
          grep -rl "proguard-android.txt" "$HOME/.pub-cache/hosted" --include=build.gradle 2>/dev/null | while read -r f; do
            echo "patching $f"
            sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$f"
          done
      - run: flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: native-ecosystem/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native-ecosystem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web app + bundle the server with Node
        shell: bash
        working-directory: .
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx esbuild server.ts --bundle --platform=node --format=cjs --external:vite --outfile=native-ecosystem/windows_server/server.cjs
          cp -r dist native-ecosystem/windows_server/dist
          cp firebase-applet-config.json native-ecosystem/windows_server/
          cp "$(which node)" native-ecosystem/windows_server/node.exe
          ls -la native-ecosystem/windows_server
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --project-name my_multi_functional_scanner .
      - run: flutter pub get
      - name: Apply app logo (EXE icon)
        run: Copy-Item branding\app_icon.ico windows\runner\resources\app_icon.ico -Force
      - name: Build Windows release
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: flutter build windows --release
      - name: Add the server to the app folder
        run: |
          Copy-Item windows_server build\windows\x64\runner\Release\server -Recurse -Force
          Get-ChildItem build\windows\x64\runner\Release\server | Select-Object Name, Length
      - name: Bundle Visual C++ runtime DLLs
        run: |
          foreach ($d in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "C:\Windows\System32\$d" "build\windows\x64\runner\Release\" -Force
          }
      - name: Smoke test - launch the EXE and wait for the server
        continue-on-error: true
        run: |
          $exe = "build\windows\x64\runner\Release\my_multi_functional_scanner.exe"
          $p = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest "http://localhost:3000/" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if ($p.HasExited) { Write-Host "APP EXITED EARLY, exit code: $($p.ExitCode)" }
          if ($ok) { Write-Host "SERVER IS UP on http://localhost:3000" } else { Write-Host "SERVER DID NOT START" }
          curl.exe -k -s -o NUL -w "HTTPS check on 3443: %{http_code}`n" https://localhost:3443/
          Get-Process -Name node, my_multi_functional_scanner -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { exit 1 }
      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\my_scanner_setup.iss
      - name: List build output
        if: always()
        run: |
          Get-ChildItem -Recurse -Filter *.exe build | Select-Object -ExpandProperty FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app-folder
          path: native-ecosystem/build/windows/x64/runner/Release/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: native-ecosystem/build/installer/**
          if-no-files-found: error
