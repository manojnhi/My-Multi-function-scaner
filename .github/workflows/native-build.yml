name: Native builds (Android APK + Windows EXE)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-ecosystem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Generates missing platform scaffolding (AndroidManifest, gradle wrapper, ...)
      # without overwriting the files already in the repo.
      # Drop the legacy hand-written gradle files; Flutter generates a matching, up-to-date setup.
      - run: rm -f android/app/build.gradle android/app/proguard-rules.pro
      - run: flutter create --platforms=android --org com.scanner --project-name my_multi_functional_scanner .
      - name: Set minSdk 24
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i 's/flutter\.minSdkVersion/24/' "$f" || true
          done
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: native-ecosystem/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native-ecosystem
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --project-name my_multi_functional_scanner .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\my_scanner_setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            native-ecosystem/build/windows/x64/runner/Release
            native-ecosystem/build/installer/*.exe
