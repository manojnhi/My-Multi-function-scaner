name: my_multi_functional_scanner
description: All-in-one Android Mobile & Windows Desktop document scanning ecosystem.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  image: ^4.1.7
  pdf: ^3.10.8
  google_mlkit_text_recognition: ^0.13.0
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.2+1
  path_provider: ^2.1.2
  web_socket_channel: ^2.4.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.0.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/scanner_brand_logo.jpg
